name: Daily Digest

on:
    # schedule:
    #    - cron: "37 11 * * *"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Print the digest instead of sending it"
                type: boolean
                default: false
            weekly:
                description: "Also build the weekly digest, whatever the day"
                type: boolean
                default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
    digest:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out repo
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"
                cache: pip
            
            - name: Install dependencies
              run: pip install -r requirements.txt

            # seen.json lives on the "state" branch so main stays free of bot commits
            - name: Load seen.json
              run: |
                if git fetch --depth=1 origin state; then
                  git show FETCH_HEAD:seen.json > seen.json
                  echo "STATE_TREE=$(git rev-parse FETCH_HEAD^{tree})" >> "$GITHUB_ENV"
                else
                  echo "No state branch yet; starting fresh."
                fi
            
            - name: Send digest
              env:
                DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: |
                ARGS=""
                if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
                if [ "${{ inputs.weekly }}" = "true" ]; then ARGS="$ARGS --weekly"; fi
                python digest/main.py $ARGS
            - name: Save seen.json
              if: ${{ !inputs.dry_run }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
                blob=$(git hash-object -w seen.json)
                tree=$(printf '100644 blob %s\tseen.json\n' "$blob" | git mktree)
                if [ "$tree" = "${STATE_TREE:-}" ]; then
                  echo "No changes to seen.json"
                else
                  # One-commit branch, replaced on every run
                  commit=$(git commit-tree "$tree" -m "Update seen.json")
                  git push --force origin "$commit:refs/heads/state"
                fi
