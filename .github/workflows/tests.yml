name: Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repo
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"
                cache: pip
            
            - name: Install dependencies
              run: pip install -r requirements-dev.txt
            - name: Run tests
              run: pytest -v