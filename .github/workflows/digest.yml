name: Daily Digest

on:
    # schedule:
    #    - cron: "37 11 * * *"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Print the digest instead of sending it"
                type: boolean
                default: false
            weekly:
                description: "Also build the weekly digest, whatever the day"
                type: boolean
                default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
    digest:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out repo
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"
                cache: pip
            
            - name: Install dependencies
              run: pip install -r requirements.txt
            
            - name: Send digest
              env:
                DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: |
                ARGS=""
                if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
                if [ "${{ inputs.weekly }}" = "true" ]; then ARGS="$ARGS --weekly"; fi
                python digest/main.py $ARGS
            - name: Save seen.json
              if: ${{ !inputs.dry_run }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
                git add seen.json
                if git diff --cached --quiet; then
                  echo "No changes to seen.json"
                else
                  git commit -m "Update seen.json [skip ci]"
                  git pull --rebase
                  git push
                fi